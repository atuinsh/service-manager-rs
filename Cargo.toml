[package]
name = "service-manager"
description = "Provides adapters to communicate with various operating system service managers"
categories = ["config"]
keywords = ["generator"]
version = "0.11.0"
authors = ["Chip Senkbeil <chip@senkbeil.org>"]
edition = "2021"
homepage = "https://github.com/chipsenkbeil/service-manager-rs"
repository = "https://github.com/chipsenkbeil/service-manager-rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.75.0"

[features]
default = ["encoding"]
encoding = [
    "dep:encoding_rs",
    "dep:encoding-utils",
] # probe OsStr encoding while parsing
# The service managers native to the target are always built (see build.rs). Each of these builds
# one on other targets too.
launchd = ["dep:plist"]
openrc = ["dep:which"]
rcd = []
sc = ["dep:which"]
systemd = ["dep:dirs", "dep:which"]
winsw = ["dep:which", "dep:xml-rs"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["system-tests"]

[dependencies]
cfg-if = "1.0"
clap = { version = "4", features = ["derive"], optional = true }
dirs = { version = "4.0", optional = true }
log = "0.4"
plist = { version = "1.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
which = { version = "4.0", optional = true }
xml-rs = { version = "0.8.19", optional = true }
encoding_rs = { version = "0.8", optional = true }
encoding-utils = { version ="0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Each backend's dependencies, again, for the targets it is native to.
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "4.0"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
which = "4.0"

[target.'cfg(target_os = "windows")'.dependencies]
xml-rs = "0.8.19"

[dev-dependencies]
assert_fs = "1.0.13"
indoc = "2.0.4"
predicates = "3.0.4"
